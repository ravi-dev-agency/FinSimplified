<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" fill="none" role="img" aria-labelledby="rrTitle">
  <title id="rrTitle">With a five thousand rupee daily room limit and a ten thousand rupee room, the insurer pays only half of a four lakh rupee bill. You pay the other two lakh.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">COVER ₹5,00,000 · ROOM LIMIT ₹5,000/DAY · YOU TOOK A ₹10,000/DAY ROOM</text>

  <text x="16" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7177">Your hospital bill</text>
  <rect x="16" y="60" width="568" height="40" rx="3" fill="#F5F6F7" stroke="#6B7177" stroke-width="1.5"/>
  <text x="300" y="85" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2E3338" text-anchor="middle">₹4,00,000</text>

  <text x="16" y="132" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7177">What the insurer pays, after the proportionate cut</text>
  <rect x="16" y="140" width="284" height="40" rx="3" fill="#1B6B3A"/>
  <text x="158" y="165" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">₹2,00,000</text>
  <rect x="300" y="140" width="284" height="40" rx="3" fill="#FCEDEC" stroke="#B3261E" stroke-width="1.5"/>
  <text x="442" y="160" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B3261E" text-anchor="middle">₹2,00,000</text>
  <text x="442" y="174" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#B3261E" text-anchor="middle">you pay this</text>

  <line x1="16" y1="204" x2="584" y2="204" stroke="#E3E6E9" stroke-width="1"/>
  <text x="16" y="226" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#B3261E">Your room was twice the allowed rate, so roughly half the bill became your problem.</text>
  <text x="16" y="244" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">The cut applies to surgeon fees and nursing too — not just the room charge.</text>
</svg>
