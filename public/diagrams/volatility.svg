<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" fill="none" role="img" aria-labelledby="volTitle">
  <title id="volTitle">Six yearly returns — plus 34, minus 9, plus 18, plus 2, minus 14 and plus 26 percent — averaging 9.5 percent. Not one single year is close to the average.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">WHAT AN "AVERAGE OF 9.5% A YEAR" ACTUALLY LOOKS LIKE</text>

  <line x1="44" y1="140" x2="584" y2="140" stroke="#2E3338" stroke-width="1.3"/>
  <text x="36" y="144" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#6B7177" text-anchor="end">0%</text>

  <line x1="44" y1="102" x2="584" y2="102" stroke="#1F5FA0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="584" y="98" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#1F5FA0" text-anchor="end">average 9.5%</text>

  <rect x="60" y="54" width="58" height="86" rx="2" fill="#1B6B3A"/>
  <text x="89" y="48" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#1B6B3A" text-anchor="middle">+34%</text>
  <text x="89" y="158" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#6B7177" text-anchor="middle">Year 1</text>

  <rect x="148" y="140" width="58" height="24" rx="2" fill="#B3261E"/>
  <text x="177" y="180" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#B3261E" text-anchor="middle">−9%</text>
  <text x="177" y="196" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#6B7177" text-anchor="middle">Year 2</text>

  <rect x="236" y="94" width="58" height="46" rx="2" fill="#1B6B3A"/>
  <text x="265" y="88" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#1B6B3A" text-anchor="middle">+18%</text>
  <text x="265" y="158" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#6B7177" text-anchor="middle">Year 3</text>

  <rect x="324" y="135" width="58" height="5" rx="2" fill="#1B6B3A"/>
  <text x="353" y="129" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#1B6B3A" text-anchor="middle">+2%</text>
  <text x="353" y="158" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#6B7177" text-anchor="middle">Year 4</text>

  <rect x="412" y="140" width="58" height="36" rx="2" fill="#B3261E"/>
  <text x="441" y="192" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#B3261E" text-anchor="middle">−14%</text>
  <text x="441" y="208" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#6B7177" text-anchor="middle">Year 5</text>

  <rect x="500" y="74" width="58" height="66" rx="2" fill="#1B6B3A"/>
  <text x="529" y="68" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#1B6B3A" text-anchor="middle">+26%</text>
  <text x="529" y="158" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#6B7177" text-anchor="middle">Year 6</text>

  <line x1="16" y1="222" x2="584" y2="222" stroke="#E3E6E9" stroke-width="1"/>
  <text x="16" y="242" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">Illustration only, not a real fund. Notice that not one single year is close to the average.</text>
</svg>
