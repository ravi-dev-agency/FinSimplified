<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" fill="none" role="img" aria-labelledby="nmTitle">
  <title id="nmTitle">Two funds with different NAVs. Five thousand rupees buys 500 units at a NAV of ten, or 20 units at a NAV of 250. After a twelve percent rise both are worth five thousand six hundred.</title>
  <text x="300" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177" text-anchor="middle">BOTH INVEST ₹5,000. BOTH PORTFOLIOS RISE 12%.</text>

  <rect x="16" y="38" width="264" height="118" rx="4" fill="#F5F6F7" stroke="#E3E6E9" stroke-width="1.5"/>
  <text x="148" y="62" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#2E3338" text-anchor="middle">Fund A · NAV ₹10</text>
  <text x="148" y="86" font-family="Inter, Arial, sans-serif" font-size="12" fill="#44484D" text-anchor="middle">₹5,000 ÷ ₹10 = 500 units</text>
  <text x="148" y="106" font-family="Inter, Arial, sans-serif" font-size="12" fill="#44484D" text-anchor="middle">NAV grows to ₹11.20</text>
  <text x="148" y="138" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B6B3A" text-anchor="middle">₹5,600</text>

  <text x="300" y="104" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#6B7177" text-anchor="middle">=</text>

  <rect x="320" y="38" width="264" height="118" rx="4" fill="#F5F6F7" stroke="#E3E6E9" stroke-width="1.5"/>
  <text x="452" y="62" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#2E3338" text-anchor="middle">Fund B · NAV ₹250</text>
  <text x="452" y="86" font-family="Inter, Arial, sans-serif" font-size="12" fill="#44484D" text-anchor="middle">₹5,000 ÷ ₹250 = 20 units</text>
  <text x="452" y="106" font-family="Inter, Arial, sans-serif" font-size="12" fill="#44484D" text-anchor="middle">NAV grows to ₹280</text>
  <text x="452" y="138" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B6B3A" text-anchor="middle">₹5,600</text>

  <text x="300" y="184" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177" text-anchor="middle">The number of units differs. The money does not. A ₹10 New Fund Offer is not a discount.</text>
</svg>
