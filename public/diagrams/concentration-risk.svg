<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" fill="none" role="img" aria-labelledby="crT">
  <title id="crT">If you own one company and it fails you lose everything. With five companies you lose twenty percent. With fifty companies in a diversified fund, one failure costs about two percent.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">IF ONE COMPANY YOU OWN FAILS COMPLETELY</text>

  <text x="16" y="52" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">You own 1</text>
  <rect x="120" y="40" width="30" height="16" rx="2" fill="#E2683C"/>
  <text x="470" y="52" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#E2683C" text-anchor="end">you lose 100%</text>

  <text x="16" y="92" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">You own 5</text>
  <rect x="120" y="80" width="30" height="16" rx="2" fill="#E2683C"/>
  <rect x="156" y="80" width="30" height="16" rx="2" fill="#C5DBEE"/>
  <rect x="192" y="80" width="30" height="16" rx="2" fill="#C5DBEE"/>
  <rect x="228" y="80" width="30" height="16" rx="2" fill="#C5DBEE"/>
  <rect x="264" y="80" width="30" height="16" rx="2" fill="#C5DBEE"/>
  <text x="470" y="92" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#E2683C" text-anchor="end">you lose 20%</text>

  <text x="16" y="140" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">You own 50</text>
  <text x="16" y="156" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#6B7177">(a fund)</text>
  <rect x="120" y="118" width="14" height="12" rx="1.5" fill="#E2683C"/>
  <g fill="#C5DBEE">
    <rect x="138" y="118" width="14" height="12" rx="1.5"/><rect x="156" y="118" width="14" height="12" rx="1.5"/><rect x="174" y="118" width="14" height="12" rx="1.5"/><rect x="192" y="118" width="14" height="12" rx="1.5"/><rect x="210" y="118" width="14" height="12" rx="1.5"/><rect x="228" y="118" width="14" height="12" rx="1.5"/><rect x="246" y="118" width="14" height="12" rx="1.5"/><rect x="264" y="118" width="14" height="12" rx="1.5"/><rect x="282" y="118" width="14" height="12" rx="1.5"/>
    <rect x="120" y="134" width="14" height="12" rx="1.5"/><rect x="138" y="134" width="14" height="12" rx="1.5"/><rect x="156" y="134" width="14" height="12" rx="1.5"/><rect x="174" y="134" width="14" height="12" rx="1.5"/><rect x="192" y="134" width="14" height="12" rx="1.5"/><rect x="210" y="134" width="14" height="12" rx="1.5"/><rect x="228" y="134" width="14" height="12" rx="1.5"/><rect x="246" y="134" width="14" height="12" rx="1.5"/><rect x="264" y="134" width="14" height="12" rx="1.5"/><rect x="282" y="134" width="14" height="12" rx="1.5"/>
    <rect x="120" y="150" width="14" height="12" rx="1.5"/><rect x="138" y="150" width="14" height="12" rx="1.5"/><rect x="156" y="150" width="14" height="12" rx="1.5"/><rect x="174" y="150" width="14" height="12" rx="1.5"/><rect x="192" y="150" width="14" height="12" rx="1.5"/><rect x="210" y="150" width="14" height="12" rx="1.5"/><rect x="228" y="150" width="14" height="12" rx="1.5"/><rect x="246" y="150" width="14" height="12" rx="1.5"/><rect x="264" y="150" width="14" height="12" rx="1.5"/><rect x="282" y="150" width="14" height="12" rx="1.5"/>
    <rect x="120" y="166" width="14" height="12" rx="1.5"/><rect x="138" y="166" width="14" height="12" rx="1.5"/><rect x="156" y="166" width="14" height="12" rx="1.5"/><rect x="174" y="166" width="14" height="12" rx="1.5"/><rect x="192" y="166" width="14" height="12" rx="1.5"/><rect x="210" y="166" width="14" height="12" rx="1.5"/><rect x="228" y="166" width="14" height="12" rx="1.5"/><rect x="246" y="166" width="14" height="12" rx="1.5"/><rect x="264" y="166" width="14" height="12" rx="1.5"/><rect x="282" y="166" width="14" height="12" rx="1.5"/>
    <rect x="120" y="182" width="14" height="12" rx="1.5"/><rect x="138" y="182" width="14" height="12" rx="1.5"/><rect x="156" y="182" width="14" height="12" rx="1.5"/><rect x="174" y="182" width="14" height="12" rx="1.5"/><rect x="192" y="182" width="14" height="12" rx="1.5"/><rect x="210" y="182" width="14" height="12" rx="1.5"/><rect x="228" y="182" width="14" height="12" rx="1.5"/><rect x="246" y="182" width="14" height="12" rx="1.5"/><rect x="264" y="182" width="14" height="12" rx="1.5"/>
  </g>
  <text x="470" y="156" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#3B8049" text-anchor="end">you lose 2%</text>

  <line x1="16" y1="206" x2="584" y2="206" stroke="#E3E6E9" stroke-width="1"/>
  <text x="16" y="228" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#2E3338">The market is not the dangerous part. Owning only a handful of companies is.</text>
</svg>
