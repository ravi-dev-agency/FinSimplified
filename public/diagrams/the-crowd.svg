<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270" fill="none" role="img" aria-labelledby="tcrT">
  <title id="tcrT">Before the rumour, one person surrounded by seven groups and constant invitations. After the rumour that his money was gone, the same person stands alone.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">THE TEST HE NEVER MEANT TO RUN</text>

  <text x="150" y="48" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2E3338" text-anchor="middle">WHILE HE HAD MONEY</text>

  <g stroke="#2E3338" stroke-width="2" stroke-linecap="round" fill="none">
    <circle cx="150" cy="122" r="15"/>
    <path d="M150 137v26M150 145l-12 10M150 145l12 10M150 163l-7 18M150 163l7 18"/>
  </g>

  <g fill="#A8C8E4" stroke="#1F5FA0" stroke-width="1.4">
    <circle cx="86" cy="86" r="11"/><circle cx="150" cy="72" r="11"/><circle cx="214" cy="86" r="11"/>
    <circle cx="66" cy="140" r="11"/><circle cx="234" cy="140" r="11"/>
    <circle cx="90" cy="192" r="11"/><circle cx="210" cy="192" r="11"/>
  </g>

  <text x="150" y="228" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#44484D" text-anchor="middle">seven groups · constant invitations</text>

  <line x1="300" y1="40" x2="300" y2="240" stroke="#E3E6E9" stroke-width="1.5"/>

  <text x="450" y="48" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B44A22" text-anchor="middle">THE WEEK THEY THOUGHT IT WAS GONE</text>

  <g stroke="#2E3338" stroke-width="2" stroke-linecap="round" fill="none">
    <circle cx="450" cy="122" r="15"/>
    <path d="M450 137v26M450 145l-12 10M450 145l12 10M450 163l-7 18M450 163l7 18"/>
  </g>

  <text x="450" y="228" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#B44A22" text-anchor="middle">nobody</text>

  <line x1="16" y1="248" x2="584" y2="248" stroke="#E3E6E9" stroke-width="1"/>
  <text x="300" y="266" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#2E3338" text-anchor="middle">The money had not actually gone. Only the belief that he had it.</text>
</svg>
