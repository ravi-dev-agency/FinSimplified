<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" fill="none" role="img" aria-labelledby="lvsT">
  <title id="lvsT">A company needing ten crore rupees has two choices. A loan costs one crore in interest every year, must be paid even in a bad year, and after five years ten crore is still owed. Selling shares costs no interest and nothing is repaid, but a share of all future profits is given away permanently.</title>
  <rect x="196" y="10" width="208" height="38" rx="3" fill="#2E3338"/>
  <text x="300" y="34" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Company needs ₹10 crore</text>

  <path d="M250 48 L250 64 L150 64 L150 82" stroke="#2E3338" stroke-width="1.3" fill="none"/>
  <path d="M146 74 l4 8 l4 -8 z" fill="#2E3338"/>
  <path d="M350 48 L350 64 L450 64 L450 82" stroke="#2E3338" stroke-width="1.3" fill="none"/>
  <path d="M446 74 l4 8 l4 -8 z" fill="#2E3338"/>

  <rect x="24" y="84" width="252" height="34" rx="3" fill="#E2683C"/>
  <text x="150" y="106" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Take a loan</text>
  <rect x="324" y="84" width="252" height="34" rx="3" fill="#1F5FA0"/>
  <text x="450" y="106" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Sell shares</text>

  <rect x="24" y="124" width="252" height="150" rx="3" fill="#FDF0EC" stroke="#E2683C" stroke-width="1.2"/>
  <text x="40" y="148" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#8F3A18">Interest every year</text>
  <text x="260" y="148" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8F3A18" text-anchor="end">₹1 crore</text>
  <line x1="40" y1="158" x2="260" y2="158" stroke="#F1C9BA" stroke-width="1"/>
  <text x="40" y="178" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#8F3A18">Pay in a bad year?</text>
  <text x="260" y="178" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8F3A18" text-anchor="end">Yes, always</text>
  <line x1="40" y1="188" x2="260" y2="188" stroke="#F1C9BA" stroke-width="1"/>
  <text x="40" y="208" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#8F3A18">Interest after 5 years</text>
  <text x="260" y="208" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8F3A18" text-anchor="end">₹5 crore</text>
  <line x1="40" y1="218" x2="260" y2="218" stroke="#F1C9BA" stroke-width="1"/>
  <text x="40" y="238" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#8F3A18">Still owes</text>
  <text x="260" y="238" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8F3A18" text-anchor="end">₹10 crore</text>
  <line x1="40" y1="248" x2="260" y2="248" stroke="#F1C9BA" stroke-width="1"/>
  <text x="40" y="266" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#8F3A18">Ownership</text>
  <text x="260" y="266" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8F3A18" text-anchor="end">Unchanged</text>

  <rect x="324" y="124" width="252" height="150" rx="3" fill="#EEF4FA" stroke="#1F5FA0" stroke-width="1.2"/>
  <text x="340" y="148" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1F5FA0">Interest every year</text>
  <text x="560" y="148" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1F5FA0" text-anchor="end">None</text>
  <line x1="340" y1="158" x2="560" y2="158" stroke="#C5DBEE" stroke-width="1"/>
  <text x="340" y="178" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1F5FA0">Pay in a bad year?</text>
  <text x="560" y="178" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1F5FA0" text-anchor="end">Nothing due</text>
  <line x1="340" y1="188" x2="560" y2="188" stroke="#C5DBEE" stroke-width="1"/>
  <text x="340" y="208" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1F5FA0">Repayment</text>
  <text x="560" y="208" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1F5FA0" text-anchor="end">Never</text>
  <line x1="340" y1="218" x2="560" y2="218" stroke="#C5DBEE" stroke-width="1"/>
  <text x="340" y="238" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1F5FA0">Given up instead</text>
  <text x="560" y="238" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1F5FA0" text-anchor="end">Share of profits</text>
  <line x1="340" y1="248" x2="560" y2="248" stroke="#C5DBEE" stroke-width="1"/>
  <text x="340" y="266" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#1F5FA0">Ownership</text>
  <text x="560" y="266" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1F5FA0" text-anchor="end">Now shared</text>

  <text x="300" y="292" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#2E3338" text-anchor="middle">A loan is cheaper if things go well. Shares cost nothing upfront, and everything later.</text>
</svg>
