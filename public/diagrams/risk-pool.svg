<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" fill="none" role="img" aria-labelledby="rpTitle">
  <title id="rpTitle">A thousand families each pay twelve thousand rupees a year into a common pool of 1.2 crore. About thirty of them face serious hospitalisation and draw three to ten lakh each. Nobody knows in advance which thirty.</title>
  <text x="16" y="18" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6B7177">1,000 families pay a little</text>
  <g fill="#1F5FA0" opacity="0.5">
    <circle cx="24" cy="46" r="5"/><circle cx="44" cy="46" r="5"/><circle cx="64" cy="46" r="5"/><circle cx="84" cy="46" r="5"/><circle cx="104" cy="46" r="5"/><circle cx="124" cy="46" r="5"/>
    <circle cx="24" cy="68" r="5"/><circle cx="44" cy="68" r="5"/><circle cx="64" cy="68" r="5"/><circle cx="84" cy="68" r="5"/><circle cx="104" cy="68" r="5"/><circle cx="124" cy="68" r="5"/>
    <circle cx="24" cy="90" r="5"/><circle cx="44" cy="90" r="5"/><circle cx="64" cy="90" r="5"/><circle cx="84" cy="90" r="5"/><circle cx="104" cy="90" r="5"/><circle cx="124" cy="90" r="5"/>
    <circle cx="24" cy="112" r="5"/><circle cx="44" cy="112" r="5"/><circle cx="64" cy="112" r="5"/><circle cx="84" cy="112" r="5"/><circle cx="104" cy="112" r="5"/><circle cx="124" cy="112" r="5"/>
    <circle cx="24" cy="134" r="5"/><circle cx="44" cy="134" r="5"/><circle cx="64" cy="134" r="5"/><circle cx="84" cy="134" r="5"/><circle cx="104" cy="134" r="5"/><circle cx="124" cy="134" r="5"/>
  </g>
  <text x="16" y="164" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177">₹12,000 each, per year</text>

  <path d="M148 90 h34" stroke="#6B7177" stroke-width="1.5"/><path d="M178 86 l6 4 l-6 4 z" fill="#6B7177"/>

  <rect x="196" y="46" width="184" height="88" rx="4" fill="#1F5FA0"/>
  <text x="288" y="84" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">One common pool</text>
  <text x="288" y="110" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">₹1.2 crore</text>

  <path d="M394 90 h34" stroke="#6B7177" stroke-width="1.5"/><path d="M424 86 l6 4 l-6 4 z" fill="#6B7177"/>

  <text x="444" y="18" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6B7177">30 families get a lot</text>
  <g fill="#B3261E">
    <circle cx="452" cy="50" r="6"/><circle cx="476" cy="50" r="6"/><circle cx="500" cy="50" r="6"/><circle cx="524" cy="50" r="6"/><circle cx="548" cy="50" r="6"/>
    <circle cx="452" cy="76" r="6"/><circle cx="476" cy="76" r="6"/><circle cx="500" cy="76" r="6"/><circle cx="524" cy="76" r="6"/><circle cx="548" cy="76" r="6"/>
    <circle cx="452" cy="102" r="6"/><circle cx="476" cy="102" r="6"/><circle cx="500" cy="102" r="6"/><circle cx="524" cy="102" r="6"/><circle cx="548" cy="102" r="6"/>
  </g>
  <text x="444" y="136" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177">₹3–10 lakh each</text>
  <text x="444" y="164" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2E3338">Nobody knew which thirty.</text>
</svg>
