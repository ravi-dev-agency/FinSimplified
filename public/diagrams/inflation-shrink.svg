<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="600" height="310" fill="none" role="img" aria-labelledby="infT">
  <title id="infT">One lakh rupees in a savings account at three percent, with prices rising six percent a year. In today's money it buys one lakh now, eighty-six thousand six hundred after five years, seventy-five thousand after ten, and fifty-six thousand three hundred after twenty.</title>

  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">WHAT ₹1 LAKH IN A SAVINGS ACCOUNT CAN BUY, IN TODAY'S MONEY</text>

  <rect x="60" y="66" width="90" height="180" rx="4" fill="#E3E6E9"/>
  <rect x="190" y="90" width="90" height="156" rx="4" fill="#E3E6E9"/>
  <rect x="320" y="111" width="90" height="135" rx="4" fill="#E3E6E9"/>
  <rect x="450" y="145" width="90" height="101" rx="4" fill="#1F5FA0"/>

  <text x="105" y="56" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2E3338">₹1,00,000</text>
  <text x="235" y="80" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2E3338">₹86,600</text>
  <text x="365" y="101" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2E3338">₹75,000</text>
  <text x="495" y="135" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2E3338">₹56,300</text>

  <path d="M40 246 L560 246" stroke="#8A9099" stroke-width="1"/>
  <text x="105" y="266" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#44484D">Today</text>
  <text x="235" y="266" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#44484D">5 years</text>
  <text x="365" y="266" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#44484D">10 years</text>
  <text x="495" y="266" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#44484D">20 years</text>

  <text x="16" y="298" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177">At 3% interest and 6% inflation. After 20 years the bank statement says ₹1,80,600 — it just buys less.</text>
</svg>
