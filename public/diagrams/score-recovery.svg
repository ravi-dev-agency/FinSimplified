<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" fill="none" role="img" aria-labelledby="srT">
  <title id="srT">A score starting at 620 climbs steadily over twenty-four months of on-time payments and low utilisation, reaching good territory after about a year. There is no faster path.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">RECOVERY TAKES MONTHS, NOT DAYS</text>

  <line x1="60" y1="196" x2="560" y2="196" stroke="#2E3338" stroke-width="1.2"/>
  <line x1="60" y1="40" x2="60" y2="196" stroke="#E3E6E9" stroke-width="1"/>

  <line x1="60" y1="76" x2="560" y2="76" stroke="#8FD0A8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="566" y="73" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#3B8049" text-anchor="end">750 — good</text>

  <polyline points="70,176 130,160 190,140 250,118 310,100 370,88 430,80 490,74 550,70" fill="none" stroke="#1F5FA0" stroke-width="2.2"/>
  <circle cx="70" cy="176" r="4" fill="#E2683C"/>
  <text x="70" y="192" font-family="Inter, Arial, sans-serif" font-size="10" fill="#E2683C" text-anchor="middle">620</text>
  <circle cx="310" cy="100" r="3.5" fill="#1F5FA0"/>
  <circle cx="550" cy="70" r="4" fill="#3B8049"/>

  <text x="70" y="214" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#6B7177" text-anchor="middle">start</text>
  <text x="190" y="214" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#6B7177" text-anchor="middle">3 mo</text>
  <text x="310" y="214" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#6B7177" text-anchor="middle">6 mo</text>
  <text x="430" y="214" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#6B7177" text-anchor="middle">12 mo</text>
  <text x="550" y="214" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#6B7177" text-anchor="middle">24 mo</text>

  <text x="16" y="240" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#2E3338">Clear the overdue, drop utilisation below 30%, pay on time, apply for nothing new.</text>
  <text x="16" y="254" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177">Illustration of the shape only. Anyone promising a faster fix is selling something.</text>
</svg>
