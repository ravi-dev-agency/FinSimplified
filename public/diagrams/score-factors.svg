<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" fill="none" role="img" aria-labelledby="sfT">
  <title id="sfT">Five factors drive a credit score. Payment history matters most, then credit utilisation. Age of accounts is moderate. Credit mix and new enquiries are small. The first two do most of the work.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">WHAT ACTUALLY MOVES YOUR SCORE</text>

  <text x="16" y="52" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">Payment history</text>
  <rect x="176" y="38" width="320" height="22" rx="2" fill="#1F5FA0"/>
  <text x="506" y="53" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#1F5FA0">most</text>

  <text x="16" y="90" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">Credit utilisation</text>
  <rect x="176" y="76" width="250" height="22" rx="2" fill="#3D7FB8"/>
  <text x="436" y="91" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#3D7FB8">very high</text>

  <text x="16" y="128" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">Age of accounts</text>
  <rect x="176" y="114" width="130" height="22" rx="2" fill="#6FA3D0"/>
  <text x="316" y="129" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177">moderate</text>

  <text x="16" y="166" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">Credit mix</text>
  <rect x="176" y="152" width="58" height="22" rx="2" fill="#A8C8E4"/>
  <text x="244" y="167" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177">small</text>

  <text x="16" y="204" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">New enquiries</text>
  <rect x="176" y="190" width="52" height="22" rx="2" fill="#C5DBEE"/>
  <text x="238" y="205" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177">small</text>

  <line x1="16" y1="226" x2="584" y2="226" stroke="#E3E6E9" stroke-width="1"/>
  <text x="16" y="244" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#2E3338">Get the top two right and the rest barely matters.</text>
</svg>
