<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" fill="none" role="img" aria-labelledby="hopTitle">
  <title id="hopTitle">Paying yearly costs the least overall but needs one large payment. Paying monthly costs slightly more over the year but is far easier to afford. Both buy exactly the same cover.</title>

  <text x="16" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">SAME COVER. THE ONLY DIFFERENCE IS HOW OFTEN YOU PAY.</text>

  <!-- yearly -->
  <text x="16" y="58" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#2E3338">Yearly</text>
  <rect x="100" y="44" width="132" height="22" rx="3" fill="#1B6B3A"/>
  <text x="166" y="59" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">one payment</text>
  <text x="248" y="59" font-family="Inter, Arial, sans-serif" font-size="12" fill="#44484D">cheapest overall — but you need the whole amount at once</text>

  <!-- monthly: twelve small blocks -->
  <text x="16" y="106" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#2E3338">Monthly</text>
  <g fill="#1F5FA0">
    <rect x="100" y="92" width="8" height="22" rx="2"/>
    <rect x="112" y="92" width="8" height="22" rx="2"/>
    <rect x="124" y="92" width="8" height="22" rx="2"/>
    <rect x="136" y="92" width="8" height="22" rx="2"/>
    <rect x="148" y="92" width="8" height="22" rx="2"/>
    <rect x="160" y="92" width="8" height="22" rx="2"/>
    <rect x="172" y="92" width="8" height="22" rx="2"/>
    <rect x="184" y="92" width="8" height="22" rx="2"/>
    <rect x="196" y="92" width="8" height="22" rx="2"/>
    <rect x="208" y="92" width="8" height="22" rx="2"/>
    <rect x="220" y="92" width="8" height="22" rx="2"/>
    <rect x="232" y="92" width="8" height="22" rx="2"/>
  </g>
  <rect x="244" y="92" width="9" height="22" rx="2" fill="#B3541E"/>
  <text x="264" y="107" font-family="Inter, Arial, sans-serif" font-size="12" fill="#44484D">twelve small payments, plus a little extra</text>

  <!-- the extra, called out -->
  <line x1="248" y1="88" x2="248" y2="70" stroke="#B3541E" stroke-width="1.5"/>
  <text x="254" y="80" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#B3541E">the instalment loading</text>

  <line x1="16" y1="146" x2="584" y2="146" stroke="#E3E6E9" stroke-width="1"/>

  <text x="16" y="172" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#2E3338">If ₹18,000 in one go is hard, pay monthly. A slightly dearer premium you</text>
  <text x="16" y="192" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#2E3338">actually pay beats a cheaper one you miss — a missed premium ends the cover.</text>
  <text x="16" y="216" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">Compare both figures on the quote page. The exact loading differs by insurer.</text>
</svg>
