<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" fill="none" role="img" aria-labelledby="wsTitle">
  <title id="wsTitle">The salary stops immediately, while household bills — loan EMI, school fees, rent, medicines and groceries — all continue.</title>

  <!-- left: what stops -->
  <rect x="16" y="20" width="264" height="52" rx="4" fill="#FCEDEC" stroke="#B3261E" stroke-width="1.5"/>
  <text x="148" y="43" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#B3261E" text-anchor="middle">Your salary</text>
  <text x="148" y="61" font-family="Inter, Arial, sans-serif" font-size="12" fill="#B3261E" text-anchor="middle">stops on day one</text>

  <rect x="16" y="86" width="264" height="216" rx="4" stroke="#E3E6E9" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="148" y="188" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#5A6066" text-anchor="middle">Nothing coming in</text>
  <text x="148" y="209" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7177" text-anchor="middle">from the very next month</text>

  <!-- right: what continues -->
  <rect x="320" y="20" width="264" height="52" rx="4" fill="#F5F6F7" stroke="#6B7177" stroke-width="1.5"/>
  <text x="452" y="43" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#2E3338" text-anchor="middle">Your family's bills</text>
  <text x="452" y="61" font-family="Inter, Arial, sans-serif" font-size="12" fill="#44484D" text-anchor="middle">do not stop at all</text>

  <rect x="320" y="86" width="264" height="36" rx="3" fill="#F5F6F7" stroke="#E3E6E9" stroke-width="1"/>
  <text x="452" y="109" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#2E3338" text-anchor="middle">Home loan EMI</text>

  <rect x="320" y="130" width="264" height="36" rx="3" fill="#F5F6F7" stroke="#E3E6E9" stroke-width="1"/>
  <text x="452" y="153" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#2E3338" text-anchor="middle">School fees</text>

  <rect x="320" y="174" width="264" height="36" rx="3" fill="#F5F6F7" stroke="#E3E6E9" stroke-width="1"/>
  <text x="452" y="197" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#2E3338" text-anchor="middle">Rent and electricity</text>

  <rect x="320" y="218" width="264" height="36" rx="3" fill="#F5F6F7" stroke="#E3E6E9" stroke-width="1"/>
  <text x="452" y="241" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#2E3338" text-anchor="middle">Medicines for parents</text>

  <rect x="320" y="262" width="264" height="36" rx="3" fill="#F5F6F7" stroke="#E3E6E9" stroke-width="1"/>
  <text x="452" y="285" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#2E3338" text-anchor="middle">Groceries and milk</text>

  <line x1="16" y1="322" x2="584" y2="322" stroke="#E3E6E9" stroke-width="1"/>
</svg>
