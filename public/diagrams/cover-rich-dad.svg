<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none" role="img" aria-labelledby="rdCov">
  <title id="rdCov">Two columns of money flow: things you pay for every month, and things that pay you every month. The second column is the one that makes you rich.</title>
  <rect width="400" height="300" fill="#1F5FA0"/>

  <text x="200" y="44" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#A8C8E4">ONE TEST, EVERY TIME</text>

  <text x="110" y="96" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Takes money OUT</text>
  <text x="290" y="96" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Puts money IN</text>

  <path d="M110 112 L110 176" stroke="#E2683C" stroke-width="3"/>
  <path d="M102 168 L110 178 L118 168" stroke="#E2683C" stroke-width="3" fill="none"/>

  <path d="M290 176 L290 112" stroke="#8FD0A8" stroke-width="3"/>
  <path d="M282 120 L290 110 L298 120" stroke="#8FD0A8" stroke-width="3" fill="none"/>

  <text x="110" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#C5DBEE">EMIs · the new phone</text>
  <text x="110" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#C5DBEE">the car · upgrades</text>

  <text x="290" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#C5DBEE">SIP · EPF · NPS</text>
  <text x="290" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#C5DBEE">rent received</text>

  <path d="M60 248 L340 248" stroke="#3D7FB8" stroke-width="1"/>
  <text x="200" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Buy the right column first.</text>
</svg>
