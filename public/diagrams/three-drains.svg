<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" fill="none" role="img" aria-labelledby="tdT">
  <title id="tdT">Five crore rupees at the top draining through three separate outlets below: donations asked for daily, businesses with no experience, and events taking ten to fifteen days a month. None of them is a single dramatic mistake.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">THREE HOLES, NONE OF THEM DRAMATIC</text>

  <rect x="170" y="38" width="260" height="42" rx="3" fill="#1F5FA0"/>
  <text x="300" y="65" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">₹5,00,00,000</text>

  <path d="M240 80 L240 104 L110 104 L110 128" stroke="#8A9099" stroke-width="1.6" fill="none"/>
  <path d="M106 120 l4 8 l4 -8 z" fill="#8A9099"/>
  <path d="M300 80 L300 128" stroke="#8A9099" stroke-width="1.6" fill="none"/>
  <path d="M296 120 l4 8 l4 -8 z" fill="#8A9099"/>
  <path d="M360 80 L360 104 L490 104 L490 128" stroke="#8A9099" stroke-width="1.6" fill="none"/>
  <path d="M486 120 l4 8 l4 -8 z" fill="#8A9099"/>

  <rect x="24" y="130" width="172" height="74" rx="4" fill="#FDF0EC" stroke="#E2683C" stroke-width="1.6"/>
  <text x="110" y="154" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#B44A22" text-anchor="middle">The giving</text>
  <text x="110" y="174" font-family="Inter, Arial, sans-serif" font-size="11" fill="#B44A22" text-anchor="middle">asked for daily, in person,</text>
  <text x="110" y="190" font-family="Inter, Arial, sans-serif" font-size="11" fill="#B44A22" text-anchor="middle">each amount small</text>

  <rect x="214" y="130" width="172" height="74" rx="4" fill="#FDF0EC" stroke="#E2683C" stroke-width="1.6"/>
  <text x="300" y="154" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#B44A22" text-anchor="middle">The businesses</text>
  <text x="300" y="174" font-family="Inter, Arial, sans-serif" font-size="11" fill="#B44A22" text-anchor="middle">industries he had never</text>
  <text x="300" y="190" font-family="Inter, Arial, sans-serif" font-size="11" fill="#B44A22" text-anchor="middle">worked in</text>

  <rect x="404" y="130" width="172" height="74" rx="4" fill="#FDF0EC" stroke="#E2683C" stroke-width="1.6"/>
  <text x="490" y="154" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#B44A22" text-anchor="middle">The events</text>
  <text x="490" y="174" font-family="Inter, Arial, sans-serif" font-size="11" fill="#B44A22" text-anchor="middle">10–15 days a month,</text>
  <text x="490" y="190" font-family="Inter, Arial, sans-serif" font-size="11" fill="#B44A22" text-anchor="middle">studying abandoned</text>

  <line x1="16" y1="234" x2="584" y2="234" stroke="#E3E6E9" stroke-width="1"/>
  <text x="16" y="258" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2E3338">No single decision was large enough to notice.</text>
  <text x="16" y="280" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">That is exactly why nothing stopped them.</text>
</svg>
