<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" fill="none" role="img" aria-labelledby="svwT">
  <title id="svwT">A monthly salary of six thousand rupees shown as a bar so small it is almost invisible, beside a five crore prize shown as a bar filling the whole width. The prize equals 8,333 months of that salary.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">THE SAME MAN, TWO WEEKS APART</text>

  <text x="16" y="60" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#44484D">His monthly salary</text>
  <rect x="176" y="48" width="2" height="18" rx="1" fill="#8A9099"/>
  <text x="190" y="61" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#44484D">₹6,000</text>
  <text x="256" y="61" font-family="Inter, Arial, sans-serif" font-size="11" fill="#8A9099">(the bar is 2 pixels wide — that is to scale)</text>

  <text x="16" y="108" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#44484D">What he won</text>
  <rect x="176" y="96" width="400" height="26" rx="3" fill="#1F5FA0"/>
  <text x="376" y="114" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">₹5,00,00,000</text>

  <line x1="16" y1="152" x2="584" y2="152" stroke="#E3E6E9" stroke-width="1"/>

  <text x="300" y="184" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#2E3338" text-anchor="middle">8,333 months of salary</text>
  <text x="300" y="208" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7177" text-anchor="middle">694 years of earning — arriving in a single evening</text>
  <text x="300" y="234" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#8A9099" text-anchor="middle">Nobody gets a chance to practise for that.</text>
</svg>
