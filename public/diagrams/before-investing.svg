<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" fill="none" role="img" aria-labelledby="biTitle">
  <title id="biTitle">Investments rest on a base of three layers: an emergency fund, health insurance, and term insurance where someone depends on your income. Without the base, the first emergency forces you to sell investments.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">THE BASE COMES FIRST. INVESTMENTS SIT ON TOP OF IT.</text>

  <rect x="150" y="40" width="300" height="42" rx="3" fill="#1F5FA0"/>
  <text x="300" y="66" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Investments</text>

  <rect x="110" y="92" width="380" height="38" rx="3" fill="#D6E5F2" stroke="#1F5FA0" stroke-width="1.2"/>
  <text x="300" y="116" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F5FA0" text-anchor="middle">Term insurance — if anyone depends on your income</text>

  <rect x="80" y="140" width="440" height="38" rx="3" fill="#D6E5F2" stroke="#1F5FA0" stroke-width="1.2"/>
  <text x="300" y="164" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F5FA0" text-anchor="middle">Health insurance</text>

  <rect x="50" y="188" width="500" height="38" rx="3" fill="#A8C8E4"/>
  <text x="300" y="212" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#2E3338" text-anchor="middle">Emergency fund — three to six months of expenses</text>
</svg>
