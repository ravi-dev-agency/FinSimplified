<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 340 218" width="340" height="218" fill="none" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">A rising series of coin stacks, from one coin to a tall column, with an upward arrow tracing the growth and a rupee coin above.</title>

  <!-- ground -->
  <line x1="20" y1="238" x2="320" y2="238" stroke="#2E3338" stroke-width="2.5" stroke-linecap="round"/>

  <!-- stack 1 -->
  <g stroke="#2E3338" stroke-width="2.2">
    <ellipse cx="58" cy="226" rx="26" ry="8" fill="#EEF4FA"/>
  </g>

  <!-- stack 2 -->
  <g stroke="#2E3338" stroke-width="2.2">
    <ellipse cx="128" cy="226" rx="26" ry="8" fill="#EEF4FA"/>
    <ellipse cx="128" cy="210" rx="26" ry="8" fill="#EEF4FA"/>
    <ellipse cx="128" cy="194" rx="26" ry="8" fill="#EEF4FA"/>
  </g>

  <!-- stack 3 -->
  <g stroke="#2E3338" stroke-width="2.2">
    <ellipse cx="198" cy="226" rx="26" ry="8" fill="#D6E5F2"/>
    <ellipse cx="198" cy="210" rx="26" ry="8" fill="#D6E5F2"/>
    <ellipse cx="198" cy="194" rx="26" ry="8" fill="#D6E5F2"/>
    <ellipse cx="198" cy="178" rx="26" ry="8" fill="#D6E5F2"/>
    <ellipse cx="198" cy="162" rx="26" ry="8" fill="#D6E5F2"/>
    <ellipse cx="198" cy="146" rx="26" ry="8" fill="#D6E5F2"/>
  </g>

  <!-- stack 4, the tallest -->
  <g stroke="#1F5FA0" stroke-width="2.2">
    <ellipse cx="268" cy="226" rx="26" ry="8" fill="#A8C8E4"/>
    <ellipse cx="268" cy="210" rx="26" ry="8" fill="#A8C8E4"/>
    <ellipse cx="268" cy="194" rx="26" ry="8" fill="#A8C8E4"/>
    <ellipse cx="268" cy="178" rx="26" ry="8" fill="#A8C8E4"/>
    <ellipse cx="268" cy="162" rx="26" ry="8" fill="#A8C8E4"/>
    <ellipse cx="268" cy="146" rx="26" ry="8" fill="#A8C8E4"/>
    <ellipse cx="268" cy="130" rx="26" ry="8" fill="#A8C8E4"/>
    <ellipse cx="268" cy="114" rx="26" ry="8" fill="#A8C8E4"/>
    <ellipse cx="268" cy="98" rx="26" ry="8" fill="#A8C8E4"/>
  </g>

  <!-- the growth curve -->
  <path d="M52 214 C 110 200, 150 180, 196 134 S 250 78, 286 56"
        stroke="#3B8049" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M270 52 l18 2 l-2 18"
        stroke="#3B8049" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- a rupee coin, the starting unit -->
  <circle cx="58" cy="196" r="17" fill="#fff" stroke="#1F5FA0" stroke-width="2.2"/>
  <path d="M51 190h14 M51 195h14 M51 200h5c3.5 0 6-2.2 6-5.4"
        stroke="#1F5FA0" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M55.5 200 L64 209" stroke="#1F5FA0" stroke-width="2" stroke-linecap="round"/>
</svg>
