<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" fill="none" role="img" aria-labelledby="drTitle">
  <title id="drTitle">Ten thousand rupees a month for twenty years reaches about 99.9 lakh in a direct plan but only 87.4 lakh in a regular plan — a gap of about 12.5 lakh caused by the one percent commission.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">₹10,000 A MONTH FOR 20 YEARS · YOU INVEST ₹24 LAKH EITHER WAY</text>

  <text x="16" y="56" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1B6B3A">DIRECT</text>
  <text x="16" y="73" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177">no commission</text>
  <rect x="120" y="42" width="420" height="34" rx="3" fill="#1B6B3A"/>
  <text x="330" y="64" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">₹99.9 lakh</text>

  <text x="16" y="122" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#B3541E">REGULAR</text>
  <text x="16" y="139" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177">1% a year, every year</text>
  <rect x="120" y="108" width="367" height="34" rx="3" fill="#B3541E"/>
  <text x="303" y="130" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">₹87.4 lakh</text>
  <rect x="487" y="108" width="53" height="34" rx="3" fill="#FCEDEC" stroke="#B3261E" stroke-width="1.2"/>

  <line x1="487" y1="104" x2="487" y2="90" stroke="#B3261E" stroke-width="1.2"/>
  <text x="540" y="100" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B3261E" text-anchor="end">₹12.5 lakh lost to commission</text>

  <line x1="16" y1="170" x2="584" y2="170" stroke="#E3E6E9" stroke-width="1"/>
  <text x="16" y="194" font-family="Inter, Arial, sans-serif" font-size="12" fill="#2E3338">Same fund. Same shares. Same manager. The only difference is who gets paid.</text>
  <text x="16" y="216" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177">Illustration assuming 12% direct and 11% regular. Returns are uncertain; the cost gap is not.</text>
</svg>
