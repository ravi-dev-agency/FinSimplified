<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" fill="none" role="img" aria-labelledby="aaT">
  <title id="aaT">In your twenties and thirties, seventy percent goes to large cap or index funds, twenty percent to mid and small cap, and ten percent to gold. In your forties, sixty percent large cap, ten percent mid and small cap, ten percent gold and twenty percent debt. In your fifties and above, forty percent large cap, ten percent gold and fifty percent debt.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">AS RETIREMENT GETS CLOSER, EQUITY MAKES WAY FOR DEBT</text>

  <text x="16" y="58" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">20s–30s</text>
  <rect x="100" y="44" width="329" height="26" rx="2" fill="#1F5FA0"/>
  <text x="264" y="62" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Large cap / index 70%</text>
  <rect x="431" y="44" width="94" height="26" rx="2" fill="#6FA3D0"/>
  <text x="478" y="62" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Mid/small 20%</text>
  <rect x="527" y="44" width="47" height="26" rx="2" fill="#D9A441"/>
  <text x="550" y="62" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Gold</text>

  <text x="16" y="118" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">40s</text>
  <rect x="100" y="104" width="282" height="26" rx="2" fill="#1F5FA0"/>
  <text x="241" y="122" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Large cap / index 60%</text>
  <rect x="384" y="104" width="47" height="26" rx="2" fill="#6FA3D0"/>
  <text x="407" y="122" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">10%</text>
  <rect x="433" y="104" width="47" height="26" rx="2" fill="#D9A441"/>
  <text x="456" y="122" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Gold</text>
  <rect x="482" y="104" width="92" height="26" rx="2" fill="#8A9099"/>
  <text x="528" y="122" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Debt 20%</text>

  <text x="16" y="178" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">50s and above</text>
  <rect x="100" y="164" width="188" height="26" rx="2" fill="#1F5FA0"/>
  <text x="194" y="182" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Large cap / index 40%</text>
  <rect x="290" y="164" width="47" height="26" rx="2" fill="#D9A441"/>
  <text x="313" y="182" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Gold</text>
  <rect x="339" y="164" width="235" height="26" rx="2" fill="#8A9099"/>
  <text x="456" y="182" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Debt / hybrid 50%</text>

  <line x1="16" y1="210" x2="584" y2="210" stroke="#E3E6E9" stroke-width="1"/>
  <text x="16" y="232" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#2E3338">A starting point, not a rule. If a 30% fall would make you sell, hold less equity than this.</text>
</svg>
