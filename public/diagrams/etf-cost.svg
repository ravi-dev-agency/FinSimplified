<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" fill="none" role="img" aria-labelledby="ecTitle">
  <title id="ecTitle">On one lakh rupees, an ETF's lower expense ratio saves about a hundred rupees a year. Twelve monthly trades cost about 360 rupees in brokerage and spread, so monthly investing in an ETF loses money. One purchase a year keeps the saving.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">ON ₹1,00,000 — WHAT THE CHEAPER EXPENSE RATIO ACTUALLY SAVES</text>

  <text x="16" y="50" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">ETF saves in expense ratio</text>
  <rect x="250" y="38" width="60" height="20" rx="3" fill="#1B6B3A"/>
  <text x="320" y="53" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#1B6B3A">₹100 a year</text>

  <text x="16" y="92" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">12 monthly trades cost</text>
  <rect x="250" y="80" width="216" height="20" rx="3" fill="#B3261E"/>
  <text x="476" y="95" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#B3261E">₹360 a year</text>

  <text x="16" y="134" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">1 purchase a year costs</text>
  <rect x="250" y="122" width="18" height="20" rx="3" fill="#B3541E"/>
  <text x="278" y="137" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#B3541E">₹30</text>

  <line x1="16" y1="162" x2="584" y2="162" stroke="#E3E6E9" stroke-width="1"/>
  <text x="16" y="184" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#B3261E">Monthly SIP in an ETF: you lose ₹260 a year to save ₹100.</text>
  <text x="16" y="206" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1B6B3A">One lump sum a year: the saving survives.</text>
</svg>
