<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" fill="none" role="img" aria-labelledby="tfT">
  <title id="tfT">Three friends start identically. One changes nothing, one makes a small bad choice daily, one makes a small good choice daily. After five months they look the same. After thirty-one months the difference is dramatic.</title>
  <text x="300" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177" text-anchor="middle">THREE FRIENDS. SAME START. THE ONLY DIFFERENCE IS A DAILY CHOICE.</text>

  <g stroke="#2E3338" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="110" cy="76" r="22"/><circle cx="103" cy="72" r="3" fill="#2E3338"/><circle cx="118" cy="72" r="3" fill="#2E3338"/>
    <path d="M101 85h19"/>
    <path d="M110 98v34M110 106l-18 14M110 106l18 14M110 132l-9 26M110 132l9 26"/>
  </g>
  <text x="110" y="182" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#2E3338" text-anchor="middle">Ramu</text>
  <text x="110" y="199" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177" text-anchor="middle">changes nothing</text>

  <g stroke="#B44A22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="300" cy="76" r="22"/><circle cx="293" cy="72" r="3" fill="#B44A22"/><circle cx="308" cy="72" r="3" fill="#B44A22"/>
    <path d="M291 88c5-5 13-5 19 0"/>
    <path d="M300 98v34M300 106l-18 14M300 106l18 14M300 132l-9 26M300 132l9 26"/>
  </g>
  <text x="300" y="182" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#B44A22" text-anchor="middle">Kiran</text>
  <text x="300" y="199" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177" text-anchor="middle">spends ₹200 more a day</text>

  <g stroke="#2F6B3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="490" cy="76" r="22"/><circle cx="483" cy="72" r="3" fill="#2F6B3A"/><circle cx="498" cy="72" r="3" fill="#2F6B3A"/>
    <path d="M481 84c5 6 13 6 19 0"/>
    <path d="M490 98v34M490 106l-18 14M490 106l18 14M490 132l-9 26M490 132l9 26"/>
  </g>
  <text x="490" y="182" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#2F6B3A" text-anchor="middle">Meera</text>
  <text x="490" y="199" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177" text-anchor="middle">invests ₹200 a day</text>

  <line x1="40" y1="226" x2="560" y2="226" stroke="#E3E6E9" stroke-width="1"/>

  <text x="40" y="252" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">Month 5</text>
  <text x="140" y="252" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">No visible difference. All three look identical, and Kiran feels fine.</text>

  <text x="40" y="278" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">Month 18</text>
  <text x="140" y="278" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">A gap you can just about notice. Still easy to explain away.</text>

  <text x="40" y="304" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">Month 31</text>
  <text x="140" y="304" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2E3338">The gap is enormous — and now very hard to close.</text>
</svg>
