<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" width="600" height="190" fill="none" role="img" aria-labelledby="bcTitle">
  <title id="bcTitle">A purchase made early in the billing cycle gets about fifty interest-free days before payment is due. A purchase made just before the statement date gets only about twenty.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">WHEN YOU SPEND DECIDES HOW LONG THE FREE PERIOD LASTS</text>

  <line x1="40" y1="72" x2="560" y2="72" stroke="#2E3338" stroke-width="1.5"/>
  <line x1="40" y1="66" x2="40" y2="78" stroke="#2E3338" stroke-width="1.5"/>
  <line x1="400" y1="66" x2="400" y2="78" stroke="#2E3338" stroke-width="1.5"/>
  <line x1="560" y1="66" x2="560" y2="78" stroke="#2E3338" stroke-width="1.5"/>

  <text x="40" y="58" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2E3338">cycle starts</text>
  <text x="400" y="58" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2E3338" text-anchor="middle">statement date</text>
  <text x="560" y="58" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2E3338" text-anchor="end">due date</text>

  <circle cx="56" cy="72" r="5" fill="#1B6B3A"/>
  <rect x="56" y="96" width="504" height="20" rx="3" fill="#EDF5EF" stroke="#1B6B3A" stroke-width="1.2"/>
  <text x="308" y="110" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#1B6B3A" text-anchor="middle">bought here — about 50 interest-free days</text>

  <circle cx="380" cy="72" r="5" fill="#B3541E"/>
  <rect x="380" y="124" width="180" height="20" rx="3" fill="#FDF3EC" stroke="#B3541E" stroke-width="1.2"/>
  <text x="470" y="138" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#B3541E" text-anchor="middle">bought here — about 20 days</text>

  <text x="16" y="174" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">Both are free — if you pay the full amount by the due date. If you do not, interest is usually</text>
  <text x="16" y="188" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">charged from each purchase date, and the free period disappears retrospectively.</text>
</svg>
