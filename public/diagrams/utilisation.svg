<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" width="600" height="210" fill="none" role="img" aria-labelledby="utTitle">
  <title id="utTitle">With a two lakh rupee credit limit, sixty thousand outstanding is thirty percent utilisation and healthy. One lakh sixty thousand outstanding is eighty percent and damages the score even if the bill is paid in full.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">TOTAL CREDIT LIMIT ₹2,00,000 — HOW MUCH SHOWS ON THE STATEMENT</text>

  <text x="16" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7177">₹60,000 outstanding</text>
  <rect x="16" y="60" width="568" height="32" rx="3" fill="#F5F6F7" stroke="#E3E6E9" stroke-width="1.5"/>
  <rect x="16" y="60" width="170" height="32" rx="3" fill="#1B6B3A"/>
  <text x="101" y="81" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">30%</text>
  <text x="200" y="81" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1B6B3A">healthy — under the 30% line</text>

  <text x="16" y="128" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7177">₹1,60,000 outstanding</text>
  <rect x="16" y="136" width="568" height="32" rx="3" fill="#F5F6F7" stroke="#E3E6E9" stroke-width="1.5"/>
  <rect x="16" y="136" width="454" height="32" rx="3" fill="#B3261E"/>
  <text x="243" y="157" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">80%</text>
  <text x="484" y="157" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B3261E">score falls</text>

  <text x="16" y="196" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">Measured on your statement date — not the day you pay. Paying in full is not enough on its own.</text>
</svg>
