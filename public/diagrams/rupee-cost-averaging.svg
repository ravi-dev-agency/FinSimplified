<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" fill="none" role="img" aria-labelledby="rcaT">
  <title id="rcaT">As the fund price falls from fifty rupees to thirty-four and recovers to fifty-five, the same five thousand rupee monthly instalment buys more units when the price is low and fewer when it is high. The most units are bought in month four, when the price is lowest.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">THE SAME ₹5,000 EVERY MONTH, AS THE PRICE MOVES</text>

  <text x="16" y="46" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#6B7177">PRICE (NAV)</text>
  <polyline points="60,72 135,96 210,120 285,136 360,112 435,80 510,52" fill="none" stroke="#1F5FA0" stroke-width="2"/>
  <circle cx="60" cy="72" r="3.5" fill="#1F5FA0"/><text x="60" y="64" font-family="Inter, Arial, sans-serif" font-size="10" fill="#1F5FA0" text-anchor="middle">₹50</text>
  <circle cx="135" cy="96" r="3.5" fill="#1F5FA0"/><text x="135" y="88" font-family="Inter, Arial, sans-serif" font-size="10" fill="#1F5FA0" text-anchor="middle">₹44</text>
  <circle cx="210" cy="120" r="3.5" fill="#1F5FA0"/><text x="210" y="112" font-family="Inter, Arial, sans-serif" font-size="10" fill="#1F5FA0" text-anchor="middle">₹38</text>
  <circle cx="285" cy="136" r="4.5" fill="#E2683C"/><text x="285" y="128" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#E2683C" text-anchor="middle">₹34</text>
  <circle cx="360" cy="112" r="3.5" fill="#1F5FA0"/><text x="360" y="104" font-family="Inter, Arial, sans-serif" font-size="10" fill="#1F5FA0" text-anchor="middle">₹40</text>
  <circle cx="435" cy="80" r="3.5" fill="#1F5FA0"/><text x="435" y="72" font-family="Inter, Arial, sans-serif" font-size="10" fill="#1F5FA0" text-anchor="middle">₹48</text>
  <circle cx="510" cy="52" r="3.5" fill="#1F5FA0"/><text x="510" y="44" font-family="Inter, Arial, sans-serif" font-size="10" fill="#1F5FA0" text-anchor="middle">₹55</text>

  <line x1="16" y1="158" x2="584" y2="158" stroke="#E3E6E9" stroke-width="1"/>
  <text x="16" y="178" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#6B7177">UNITS BOUGHT</text>

  <rect x="42" y="238" width="36" height="34" rx="2" fill="#A8C8E4"/>
  <text x="60" y="232" font-family="Inter, Arial, sans-serif" font-size="10" fill="#44484D" text-anchor="middle">100</text>
  <rect x="117" y="230" width="36" height="42" rx="2" fill="#8FB8DC"/>
  <text x="135" y="224" font-family="Inter, Arial, sans-serif" font-size="10" fill="#44484D" text-anchor="middle">114</text>
  <rect x="192" y="219" width="36" height="53" rx="2" fill="#6FA3D0"/>
  <text x="210" y="213" font-family="Inter, Arial, sans-serif" font-size="10" fill="#44484D" text-anchor="middle">132</text>
  <rect x="267" y="209" width="36" height="63" rx="2" fill="#E2683C"/>
  <text x="285" y="203" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#E2683C" text-anchor="middle">147</text>
