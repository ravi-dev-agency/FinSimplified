  <line x1="30" y1="272" x2="546" y2="272" stroke="#2E3338" stroke-width="1.2"/>
  <text x="285" y="288" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#E2683C" text-anchor="middle">cheapest month buys the most units</text>
