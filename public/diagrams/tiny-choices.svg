<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" fill="none" role="img" aria-labelledby="tcT">
  <title id="tcT">A single small choice looks like nothing on day one. Repeated daily it becomes a habit, then a routine, then a result. The arrow widens from a thin line into a thick band.</title>
  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">HOW SOMETHING THAT LOOKS LIKE NOTHING BECOMES EVERYTHING</text>

  <path d="M40 150 C 180 150, 300 148, 420 134 S 540 104, 566 92" stroke="#1F5FA0" stroke-width="1.5" fill="none"/>
  <path d="M40 152 C 180 154, 300 160, 420 176 S 540 212, 566 228" stroke="#1F5FA0" stroke-width="1.5" fill="none"/>
  <path d="M40 150 C 180 150, 300 148, 420 134 S 540 104, 566 92 L566 228 C 540 212, 480 190, 420 176 S 180 154, 40 152 Z" fill="#EEF4FA"/>

  <circle cx="46" cy="151" r="5" fill="#1F5FA0"/>
  <text x="46" y="136" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#1F5FA0" text-anchor="middle">one</text>
  <text x="46" y="122" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#1F5FA0" text-anchor="middle">choice</text>

  <text x="190" y="145" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#44484D" text-anchor="middle">repeated daily</text>
  <text x="190" y="178" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177" text-anchor="middle">becomes a habit</text>

  <text x="360" y="128" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#44484D" text-anchor="middle">held for months</text>
  <text x="360" y="196" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177" text-anchor="middle">becomes a routine</text>

  <text x="520" y="82" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#2F6B3A" text-anchor="middle">a result</text>
  <text x="520" y="242" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#B44A22" text-anchor="middle">or a problem</text>

  <text x="16" y="243" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177">The choice is small either way. Only the direction differs.</text>
</svg>
