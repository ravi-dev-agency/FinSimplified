<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none" role="img" aria-labelledby="rrT">
  <title id="rrT">Kiyosaki's board game has two tracks. The inner loop is the rat race, where a bigger salary brings bigger expenses and the player goes round and round. The way out is not a higher salary but passive income from assets growing until it exceeds monthly expenses. Only then does the player reach the outer track.</title>

  <text x="16" y="20" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">THE GAME HE BUILT TO TEACH IT</text>

  <!-- Outer track -->
  <ellipse cx="300" cy="190" rx="250" ry="140" fill="none" stroke="#3B8049" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="222" y="26" width="156" height="26" rx="4" fill="#edf5ef"/>
  <text x="300" y="44" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#2F6B3A">THE FAST TRACK</text>
  <text x="300" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#2F6B3A">assets pay the bills — the salary is optional</text>

  <!-- Inner loop -->
  <ellipse cx="300" cy="190" rx="138" ry="78" fill="#fdf3ec" stroke="#E2683C" stroke-width="2"/>
  <text x="300" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#B44A22">THE RAT RACE</text>
  <text x="300" y="175" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#44484D">bigger salary</text>
  <text x="300" y="192" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#44484D">→ bigger expenses</text>
  <text x="300" y="209" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#44484D">→ round again</text>

  <!-- Circulating arrows on the inner loop -->
  <path d="M168 170 L160 184 L174 186" stroke="#E2683C" stroke-width="2" fill="none"/>
  <path d="M432 210 L440 196 L426 194" stroke="#E2683C" stroke-width="2" fill="none"/>

  <!-- The exit -->
  <path d="M300 112 L300 84" stroke="#3B8049" stroke-width="2.5"/>
  <path d="M292 94 L300 80 L308 94" stroke="#3B8049" stroke-width="2.5" fill="none"/>
  <text x="316" y="104" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2F6B3A">the only exit</text>

  <path d="M16 358 L584 358" stroke="#E3E6E9" stroke-width="1"/>
  <text x="300" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2E3338">You leave when passive income &gt; monthly expenses.</text>
  <text x="300" y="398" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">Not when the salary is big enough. There is no salary big enough.</text>
</svg>
