<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" fill="none" role="img" aria-labelledby="fvcTitle">
  <title id="fvcTitle">The same sixty thousand rupee hospital bill. Ramu pays sixty thousand from his savings, settled the same day. Kiran pays about seventy-six thousand on a credit card over fourteen months, and stops his SIP for a year.</title>

  <text x="16" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7177">THE SAME ₹60,000 HOSPITAL BILL</text>

  <!-- Ramu -->
  <text x="16" y="54" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B6B3A">RAMU</text>
  <text x="16" y="71" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177">paid from savings</text>

  <rect x="120" y="40" width="330" height="26" rx="3" fill="#1B6B3A"/>
  <text x="285" y="57" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">₹60,000</text>
  <text x="462" y="57" font-family="Inter, Arial, sans-serif" font-size="12" fill="#44484D">settled same day</text>

  <!-- Kiran -->
  <text x="16" y="118" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#B3261E">KIRAN</text>
  <text x="16" y="135" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7177">paid by credit card</text>

  <rect x="120" y="104" width="330" height="26" rx="3" fill="#B3261E"/>
  <text x="285" y="121" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">₹60,000</text>

  <rect x="450" y="104" width="105" height="26" rx="3" fill="#B3541E"/>
  <text x="502" y="121" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">+₹16,000</text>

  <text x="120" y="150" font-family="Inter, Arial, sans-serif" font-size="11" fill="#B3261E">14 months to clear — and his SIP stopped for a year</text>
  <text x="502" y="150" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#B3541E" text-anchor="middle">interest</text>

  <line x1="16" y1="180" x2="584" y2="180" stroke="#E3E6E9" stroke-width="1"/>

  <text x="16" y="206" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#2E3338">Same problem. Kiran paid <tspan font-weight="600">₹16,000 more</tspan> and lost a year of investing.</text>
  <text x="16" y="230" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#6B7177">Illustrative. 40% a year, cleared over 14 months. Paying only the minimum due costs far more.</text>
</svg>
